# @file draft-release.yml
# @brief Build a draft release from new stable Spicetify/ivLyrics releases; the owner installs it and publishes by hand.
name: Automatic draft release
on:
  schedule:
    - cron: '57 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; push no branch and create no draft
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      IVLYRICS_REQUIRE_UI_TESTS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install locked UI test fixtures
        run: npm ci --ignore-scripts --prefix tests/ui
      - run: python scripts/fetch_distribution_inputs.py
      - name: Stage, check, build and draft
        run: python scripts/auto_draft.py $(if ('${{ inputs.dry_run }}' -eq 'true') { '--dry-run' })
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-release
          path: |
            work/upstream-status.json
            work/compatibility*.json
            work/release-candidates/*/release-notes.md
